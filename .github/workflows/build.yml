name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393'

      # 🔥 FIX: AGP 8.6.1 এর জন্য Gradle 8.7 ব্যবহার করতে হবে
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          cache-read-only: false

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        continue-on-error: true

      # ============================================================
      # 🔑 Decode Keystore from GitHub Secrets
      #    - If KEYSTORE_BASE64 exists → decode it
      #    - Otherwise → skip (build will be unsigned)
      # ============================================================
      - name: Decode Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "⚠️  KEYSTORE_BASE64 secret not set — release will be unsigned"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > ${{ github.workspace }}/release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✅ Keystore decoded to ${{ github.workspace }}/release.keystore"
            ls -la ${{ github.workspace }}/release.keystore
          fi

      # ============================================================
      # 🔨 Build Debug APK (always builds)
      # ============================================================
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # ============================================================
      # 🔨 Build Release APK (signed with keystore)
      # ============================================================
      - name: Build Release APK (signed)
        if: steps.keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      # ============================================================
      # 🔨 Build Release APK (unsigned fallback — if no keystore)
      # ============================================================
      - name: Build Release APK (unsigned fallback)
        if: steps.keystore.outputs.has_keystore != 'true'
        run: gradle assembleRelease --stacktrace
        continue-on-error: true

      # ============================================================
      # 📦 Upload Artifacts
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ModXLab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Signed Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ModXLab-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Unsigned Release APK
        if: steps.keystore.outputs.has_keystore != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ModXLab-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn