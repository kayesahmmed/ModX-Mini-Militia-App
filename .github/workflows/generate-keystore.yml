name: 🔑 Generate Release Keystore (ONE-TIME)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (ONLY a-z A-Z 0-9, min 8 chars)'
        required: true
      alias:
        description: 'Key alias'
        required: true
        default: 'modxlab'
      common_name:
        description: 'Your name or brand'
        required: true
        default: 'ModXLab'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Keystore
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          ALIAS: ${{ github.event.inputs.alias }}
          CN: ${{ github.event.inputs.common_name }}
        run: |
          # Simple alphanumeric password only — avoids shell metachar issues
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=$CN, OU=Dev, O=ModXLab, L=Dhaka, S=Dhaka, C=BD"

      - name: Verify Keystore (sanity check)
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          echo "🔍 Verifying keystore can be opened..."
          keytool -list -keystore release.keystore -storepass "$STORE_PASS" -storetype PKCS12
          echo "✅ Keystore verified OK"

      - name: Show SHA-256 fingerprint
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          echo "=========================================="
          echo "  🔑 SHA-256 FINGERPRINT"
          echo "=========================================="
          keytool -list -v -keystore release.keystore \
            -alias "$ALIAS" -storepass "$STORE_PASS" -storetype PKCS12 \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: //'
          echo ""
          echo "👉 Copy above, remove all ':' , lowercase it."

      - name: Show Base64 keystore
        run: |
          echo "=========================================="
          echo "  📦 BASE64 KEYSTORE"
          echo "=========================================="
          base64 -w0 release.keystore
          echo ""
          echo "=========================================="
          echo "👉 Copy the WHOLE string above."
          echo "=========================================="
