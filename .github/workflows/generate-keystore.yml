name: 🔑 Generate Release Keystore (ONE-TIME)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore store password (min 6 chars)'
        required: true
      key_password:
        description: 'Key password (min 6 chars)'
        required: true
      alias:
        description: 'Key alias'
        required: true
        default: 'modxlab'
      common_name:
        description: 'Your name or brand (e.g. ModXLab)'
        required: true
        default: 'ModXLab'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=${{ github.event.inputs.common_name }}, OU=Dev, O=ModXLab, L=Dhaka, S=Dhaka, C=BD"

      - name: Show SHA-256 fingerprint
        run: |
          echo "=========================================="
          echo "  🔑 SHA-256 FINGERPRINT"
          echo "=========================================="
          keytool -list -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.alias }}" \
            -storepass "${{ github.event.inputs.store_password }}" \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: //'
          echo ""
          echo "👉 Copy above, remove all ':' , lowercase it."

      - name: Show Base64 keystore
        run: |
          echo "=========================================="
          echo "  📦 BASE64 KEYSTORE"
          echo "=========================================="
          base64 -w0 release.keystore
          echo ""
          echo "=========================================="
          echo "👉 Copy the WHOLE string above."
          echo "=========================================="