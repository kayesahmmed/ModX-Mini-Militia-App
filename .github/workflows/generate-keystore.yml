name: 🔑 Generate Release Keystore (ONE-TIME)

# ================================================================
# ONE-TIME workflow — used ONLY to generate a new release keystore.
#
# Steps after running:
#   1. Copy the SHA-256 fingerprint (remove colons, lowercase)
#   2. Paste it into Security.cpp → SHA256_PRIMARY()
#   3. Copy the Base64 keystore → GitHub Secrets → KEYSTORE_BASE64
#   4. Save the passwords in GitHub Secrets
#   5. DELETE this file from the repo after use
#
# NEVER commit the resulting keystore or base64 to the repo.
# ================================================================

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (A-Z a-z 0-9 ONLY, min 8 chars, no special chars)'
        required: true
      alias:
        description: 'Key alias'
        required: true
        default: 'modxlab'
      common_name:
        description: 'Your name or brand (e.g., ModXLab)'
        required: true
        default: 'ModXLab'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate password format
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
        run: |
          if [ ${#STORE_PASS} -lt 8 ]; then
            echo "❌ ERROR: Password must be at least 8 characters"
            exit 1
          fi
          if ! echo "$STORE_PASS" | grep -qE '^[A-Za-z0-9]+$'; then
            echo "❌ ERROR: Password must contain ONLY letters and numbers"
            echo "   Special characters (@, \$, !, #, etc.) will break the build"
            exit 1
          fi
          echo "✅ Password format valid (length: ${#STORE_PASS})"

      - name: Generate Keystore (PKCS12)
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          ALIAS: ${{ github.event.inputs.alias }}
          CN: ${{ github.event.inputs.common_name }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=$CN, OU=Dev, O=ModXLab, L=Dhaka, S=Dhaka, C=BD"

          echo ""
          echo "✅ Keystore generated successfully"
          ls -la release.keystore

      - name: Verify Keystore (sanity check)
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          echo "🔍 Verifying keystore can be opened..."
          keytool -list -keystore release.keystore \
            -storepass "$STORE_PASS" \
            -storetype PKCS12 \
            -alias "$ALIAS"
          echo ""
          echo "✅ Keystore verified OK"

      - name: Show SHA-256 fingerprint
        env:
          STORE_PASS: ${{ github.event.inputs.store_password }}
          ALIAS: ${{ github.event.inputs.alias }}
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  🔑 SHA-256 FINGERPRINT (paste into Security.cpp)"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          keytool -list -v -keystore release.keystore \
            -alias "$ALIAS" \
            -storepass "$STORE_PASS" \
            -storetype PKCS12 \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: //'
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  ⬇️  STEPS:"
          echo "  1. Copy the SHA-256 hash above (with colons)"
          echo "  2. Remove all ':' characters"
          echo "  3. Convert to lowercase"
          echo "  4. Paste into Security.cpp → SHA256_PRIMARY()"
          echo "════════════════════════════════════════════════════════════"
          echo ""

      - name: Show Base64 keystore
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  📦 BASE64 KEYSTORE (paste into GitHub Secrets)"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          base64 -w0 release.keystore
          echo ""
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  ⬇️  STEPS:"
          echo "  1. Copy the ENTIRE base64 string above"
          echo "  2. GitHub → Settings → Secrets → Actions"
          echo "  3. New secret → Name: KEYSTORE_BASE64"
          echo "  4. Value: paste the base64 string"
          echo "  5. Save"
          echo ""
          echo "  Also add these secrets:"
          echo "    KEYSTORE_PASSWORD = (your store password)"
          echo "    KEY_ALIAS         = ${{ github.event.inputs.alias }}"
          echo "    KEY_PASSWORD      = (your key password, same as store)"
          echo "════════════════════════════════════════════════════════════"
          echo ""

      - name: Show important reminder
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  ⚠️  IMPORTANT — READ CAREFULLY"
          echo "════════════════════════════════════════════════════════════"
          echo ""
          echo "  1. ✅ Saved SHA-256 → Security.cpp"
          echo "  2. ✅ Saved base64 → GitHub Secret KEYSTORE_BASE64"
          echo "  3. ✅ Saved passwords → GitHub Secrets"
          echo "  4. 🗑️  DELETE this workflow file from the repo"
          echo ""
          echo "  🔐 PASSWORD (write it down NOW):"
          echo "     ${{ github.event.inputs.store_password }}"
          echo ""
          echo "  ⚠️  Keystore loss = cannot update app ever again."
          echo "  ⚠️  Backup: keep the keystore file + passwords in"
          echo "      an encrypted note (e.g., KeePassDX)."
          echo ""
          echo "  🌐 Optionally rotate old leaked keystore:"
          echo "     Keep OLD hash in Security.cpp → SHA256_ALT1()"
          echo "     Remove it after 60-90 days."
          echo "════════════════════════════════════════════════════════════"