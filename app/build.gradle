apply plugin: 'com.android.application'

android {
    namespace 'com.android.support'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    aaptOptions {
        noCompress 'resources.arsc'
    }

    buildTypes {
        release {
            shrinkResources true           // আগে false ছিল; এখন true (custom rules এ安全工作 করে)
    minifyEnabled true
    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libModXLab.so']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module',
                'META-INF/*.version'
            ]
        }
    }
}

// Auto-clean stale .so
tasks.register('cleanDuplicateSoFiles') {
    description = 'Removes stale libModXLab.so from src/main/jniLibs'
    group = 'build'
    doLast {
        def jniLibsDir = file('src/main/jniLibs')
        if (!jniLibsDir.exists()) return
        jniLibsDir.eachDir { abiDir ->
            def soFile = new File(abiDir, 'libModXLab.so')
            if (soFile.exists()) {
                soFile.delete()
                println "🗑️  [AUTO-CLEAN] Deleted: ${soFile.absolutePath}"
            }
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn 'cleanDuplicateSoFiles'
    }

    // 🔥 প্রতি build এ NDK rebuild করানোর জন্য
    tasks.matching { it.name.startsWith("buildNdkBuild") }.configureEach {
        outputs.upToDateWhen { false }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.multidex:multidex:2.0.1'
}
