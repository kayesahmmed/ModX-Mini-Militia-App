apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'   // 🔥 Firebase plugin

android {
    namespace 'com.android.support'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "4.0"

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    aaptOptions {
        noCompress 'resources.arsc'
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    // ================================================================
    // 🔥 Safety net: পুরনো ফাইল কোনোভাবে থেকে গেলে pickFirsts দিয়ে handle
    // ================================================================
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libModXLab.so']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module',
                'META-INF/*.version'
            ]
        }
    }
}

// ====================================================================
// 🔥 AUTO-CLEAN TASK
// jniLibs ফোল্ডারের libModXLab.so আগের build এর থেকে এলে auto-delete
// প্রতিবার build শুরু হওয়ার আগেই run হবে → আর ম্যানুয়ালি ডিলিট লাগবে না
// ====================================================================
tasks.register('cleanDuplicateSoFiles') {
    description = 'Removes stale libModXLab.so from src/main/jniLibs before each build'
    group = 'build'

    doLast {
        def jniLibsDir = file('src/main/jniLibs')
        if (!jniLibsDir.exists()) {
            println "✅ [AUTO-CLEAN] jniLibs folder নেই — কিছু ডিলিট করার নেই"
            return
        }

        def deletedCount = 0
        jniLibsDir.eachDir { abiDir ->
            def soFile = new File(abiDir, 'libModXLab.so')
            if (soFile.exists()) {
                if (soFile.delete()) {
                    deletedCount++
                    println "🗑️  [AUTO-CLEAN] Deleted: ${soFile.absolutePath}"
                } else {
                    println "⚠️  [AUTO-CLEAN] Failed to delete: ${soFile.absolutePath}"
                }
            }
        }

        if (deletedCount == 0) {
            println "✅ [AUTO-CLEAN] কোনো conflicting libModXLab.so পাওয়া যায়নি (clean state)"
        } else {
            println "✅ [AUTO-CLEAN] মোট ${deletedCount}টি ফাইল ডিলিট হয়েছে"
        }
    }
}

// preBuild task এর সাথে hook করা হচ্ছে — এটা debug + release দুটোর জন্যই আগে run হবে
afterEvaluate {
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn 'cleanDuplicateSoFiles'
    }
}

// ====================================================================
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    // Google Play Services Auth
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // AndroidX Multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.7.1'
}
