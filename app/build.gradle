apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.android.support'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "4.0"

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    aaptOptions {
        noCompress 'resources.arsc'
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 🔥 Single dex চেষ্টা — যদি method limit মানে ফিট হয়
            multiDexKeepProguard file('multidex-config.pro')
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libModXLab.so']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module',
                'META-INF/*.version'
            ]
        }
    }
}

// Auto-clean stale .so
tasks.register('cleanDuplicateSoFiles') {
    description = 'Removes stale libModXLab.so from src/main/jniLibs'
    group = 'build'
    doLast {
        def jniLibsDir = file('src/main/jniLibs')
        if (!jniLibsDir.exists()) return
        jniLibsDir.eachDir { abiDir ->
            def soFile = new File(abiDir, 'libModXLab.so')
            if (soFile.exists()) {
                soFile.delete()
                println "🗑️  [AUTO-CLEAN] Deleted: ${soFile.absolutePath}"
            }
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn 'cleanDuplicateSoFiles'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // 🔥 Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    // 🔥 Google Play Services Auth বাদ দেওয়া হয়েছে — 200K+ methods save হয়

    // AndroidX Multidex (fallback)
    implementation 'androidx.multidex:multidex:2.0.1'
}
