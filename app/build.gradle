apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'   // 🔥 Firebase plugin

android {
    namespace 'com.android.support'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.android.support"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "4.0"

        // Multidex — Firebase এর জন্য জরুরি
        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // 🌟 Android 14 এ resources.arsc কম্প্রেস হওয়া রোধ
    aaptOptions {
        noCompress 'resources.arsc'
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // BuildConfig class generate করার জন্য
    buildFeatures {
        buildConfig true
    }

    // ================================================================
    // 🔥 FIX: একই .so ফাইল দুই জায়গায় থাকলে first টা নেবে (crash হবে না)
    // এটা সেই error এর সমাধান:
    //   "2 files found with path 'lib/arm64-v8a/libModXLab.so'"
    // ================================================================
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libModXLab.so']
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/*.kotlin_module',
                'META-INF/*.version'
            ]
        }
    }

    // ⚠️ dexOptions বাদ দেওয়া হয়েছে (AGP 8.x এ obsolete)
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // ================================================================
    // 🔥 Firebase BoM (একটি ভার্সন — বাকি সব auto-resolved)
    // ================================================================
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    // Google Play Services Auth
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // AndroidX Multidex (Firebase এর জন্য জরুরি)
    implementation 'androidx.multidex:multidex:2.0.1'

    // AndroidX Core (Firebase এর transitive dependency কিন্তু explicit রাখা ভালো)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.annotation:annotation:1.7.1'
}
